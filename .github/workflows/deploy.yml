name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy Nimbus Platform to Cloudflare
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Deploy to Cloudflare Pages via Wrangler
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '39cd6e21a6317ad90e471a9b70a463af'
          command: pages deploy dist --project-name=nimbus-deploy-platform --branch=main

      - name: Secret Warning Check
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN repository secret is not set in GitHub repository settings!"
          echo "Please add CLOUDFLARE_API_TOKEN to https://github.com/arunkabish1/cloud-deploy-platform/settings/secrets/actions"
